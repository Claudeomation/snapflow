<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SnapFlow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three panes. Slim module rail, the workspace, and the agent that operates it. */
:root{
  --hue:262; --acc-l:.52; --acc-c:.19;
  --bg:#f3f4f8; --panel:#ffffff; --panel-2:#eceef5; --line:#dcdfea; --fg:#151825; --muted:#5d6379; --faint:#8a90a6;
  --accent:oklch(var(--acc-l) var(--acc-c) var(--hue)); --accent-soft:oklch(var(--acc-l) var(--acc-c) var(--hue) / .12); --on-accent:#fff;
  --ok:#17804f; --ok-soft:#17804f1c; --warn:#a35f00; --warn-soft:#a35f001f; --bad:#c2334d; --bad-soft:#c2334d1a;
  --muslin-a:#4c6c9c; --muslin-b:#22344f; --skin:#d9b9a0; --shirt:#e9ecf3;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --acc-l:.74; --acc-c:.14;
  --bg:#0e111a; --panel:#161a26; --panel-2:#1d2231; --line:#2a3044; --fg:#eceef6; --muted:#a0a6bd; --faint:#6f768e; --on-accent:#0e111a;
  --ok:#4fd093; --ok-soft:#4fd09322; --warn:#f0b354; --warn-soft:#f0b35422; --bad:#ff7d92; --bad-soft:#ff7d9222;
  --muslin-a:#3f5c88; --muslin-b:#16223a; color-scheme:dark } }
:root[data-theme="dark"]{
  --acc-l:.74; --acc-c:.14;
  --bg:#0e111a; --panel:#161a26; --panel-2:#1d2231; --line:#2a3044; --fg:#eceef6; --muted:#a0a6bd; --faint:#6f768e; --on-accent:#0e111a;
  --ok:#4fd093; --ok-soft:#4fd09322; --warn:#f0b354; --warn-soft:#f0b35422; --bad:#ff7d92; --bad-soft:#ff7d9222;
  --muslin-a:#3f5c88; --muslin-b:#16223a; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.15;font-weight:700} h2{font-size:16px;font-weight:700} h3{font-size:14px;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}

.app{display:grid;grid-template-columns:216px minmax(0,1fr) 372px;height:100%}
/* nav */
.nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark i{width:12px;height:12px;border:2px solid var(--on-accent);border-radius:50%;display:block}
.brand b{font-family:var(--display);font-size:17px}
.brand small{display:block;color:var(--faint);font-size:11px;line-height:1.2}
.navlist{flex:1;overflow-y:auto;padding:4px 8px 12px;display:flex;flex-direction:column;gap:2px}
.navlist .label{padding:12px 8px 4px}
.navlist a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.navlist a:hover{background:var(--panel-2);color:var(--fg)}
.navlist a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.badge{font-size:11px;font-weight:600;min-width:20px;padding:0 6px;border-radius:10px;background:var(--panel-2);color:var(--muted);text-align:center}
a[aria-current="page"] .badge{background:var(--accent);color:var(--on-accent)}
.navfoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.navfoot select{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.linkbtn{background:none;border:0;color:var(--faint);padding:0;text-align:left;font-size:12px}
.linkbtn:hover{color:var(--fg);text-decoration:underline}

/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:none;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar b{font-family:var(--display);font-size:16px;flex:1}
.view{flex:1;overflow-y:auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{color:var(--muted);max-width:62ch;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card > .label{display:block;margin-bottom:10px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}

/* insight strip: what the agent sees on this screen */
.insight{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);border:1px solid transparent}
.insight .dot{margin-top:5px}
.insight p{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.ai{background:var(--accent-soft);color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi svg{margin-top:6px;width:100%;height:30px}

.item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.item .body b{font-weight:600}
.item .body small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:20px 16px;color:var(--muted);text-align:center}

.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:left;padding:10px 14px;white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel-2)} tr.sel td{background:var(--accent-soft)}
td.r,th.r{text-align:right}
.bar{height:6px;border-radius:4px;background:var(--panel-2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}

.kan{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.kan .col{background:var(--panel-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kan .col > div:first-child{display:flex;justify-content:space-between;font-weight:600;font-size:12.5px;color:var(--muted)}
.deal{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.steps{display:flex;gap:4px;align-items:center}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--panel-2)} .steps i.on{background:var(--accent)}

.seg{display:inline-flex;background:var(--panel-2);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.switch{width:34px;height:20px;border-radius:12px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)} .switch[aria-checked="true"]::after{transform:translateX(14px)}

.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow .node{flex:1 1 130px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);font-size:12.5px}
.flow .node b{display:block;font-size:12.5px}
.flow .node.done{border-color:var(--ok);background:var(--ok-soft)}
.flow .node.trigger{background:var(--accent-soft);border-color:transparent}

/* capture */
.finder{position:relative;aspect-ratio:4/5;max-width:100%;width:340px;border-radius:12px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,var(--muslin-a),var(--muslin-b));margin:0 auto}
.finder .head-s{position:absolute;left:50%;top:24%;width:30%;aspect-ratio:1/1.15;border-radius:50%;background:var(--skin);transform:translateX(-50%)}
.finder .body-s{position:absolute;left:50%;bottom:-8%;width:74%;height:44%;border-radius:46% 46% 0 0;background:var(--shirt);transform:translateX(-50%)}
.finder .face{position:absolute;left:31%;top:21%;width:38%;height:36%;border:1.5px solid #fff;border-radius:4px;opacity:.85}
.finder .face.flag{border-color:#ffb347}
.finder .cnr{position:absolute;width:22px;height:22px;border:2px solid #fff;opacity:.9}
.cnr.a{left:12px;top:12px;border-right:0;border-bottom:0}.cnr.b{right:12px;top:12px;border-left:0;border-bottom:0}.cnr.c{left:12px;bottom:36px;border-right:0;border-top:0}.cnr.d{right:12px;bottom:36px;border-left:0;border-top:0}
.finder .hud{position:absolute;left:0;right:0;bottom:0;padding:8px 14px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:#fff;background:linear-gradient(transparent,#0009)}
.finder .tag{position:absolute;left:14px;top:14px;margin:26px 0 0 0;font-family:var(--mono);font-size:11px;color:#fff;background:#0008;padding:2px 6px;border-radius:4px}
.poses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pose{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;text-align:center;background:var(--panel)}
.pose.best{border-color:var(--ok);background:var(--ok-soft)} .pose.flag{border-color:var(--warn);background:var(--warn-soft)}
.roster > button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:7px 16px;text-align:left;border-top:1px solid var(--line)}
.roster > button.cur{background:var(--accent-soft)}

/* parent portal preview */
.portal{border-radius:14px;border:1px solid var(--line);background:var(--panel);overflow:hidden}
.portal .bar2{background:var(--accent);color:var(--on-accent);padding:14px 18px;font-family:var(--display);font-weight:700;font-size:16px}
.portal .in{padding:18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;gap:8px;flex-wrap:wrap}
.field input,.inp{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea.inp{width:100%;min-height:110px;resize:vertical;line-height:1.5}
details{border-top:1px solid var(--line);padding:10px 0} details summary{font-weight:600;cursor:pointer}

/* agent */
.agent{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.agent header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.agent header h2{flex:1}
.orb{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),oklch(.8 .12 calc(var(--hue) + 80)),var(--accent));flex:none}
.orb.busy{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msgs > *{flex:none}
.msg{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:14px 14px 4px 14px;max-width:88%}
.msg.ai{color:var(--fg)}
.plan{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.plan .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.plan ol{list-style:none;margin:0;padding:6px 0}
.plan li{display:flex;gap:10px;align-items:flex-start;padding:5px 12px;font-size:13px}
.plan li .st{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--faint);flex:none;margin-top:2px}
.plan li.run .st{border-color:var(--accent);border-top-color:transparent;animation:spin .7s linear infinite}
.plan li.done .st{background:var(--ok);border-color:var(--ok)}
.plan li.skip{color:var(--faint);text-decoration:line-through}
.plan li small{display:block;color:var(--muted)}
.plan .pf{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chip{border:1px solid var(--line);background:none;border-radius:16px;padding:4px 10px;font-size:12.5px;color:var(--muted);text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.composer{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;line-height:1.4;max-height:120px}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:500;z-index:50;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.scrim{display:none}
.onlysm{display:none}

@media (max-width:1180px){
  .app{grid-template-columns:216px minmax(0,1fr)}
  .agent{position:fixed;inset:0 0 0 auto;width:min(400px,100%);z-index:30;transform:translateX(100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .app.agent-open .agent{transform:none;box-shadow:-20px 0 60px #0005}
  .app.agent-open .scrim,.app.nav-open .scrim{display:block;position:fixed;inset:0;background:#0006;z-index:20}
  .topbar{display:flex}
  .onlysm{display:inline-flex}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;inset:0 auto 0 0;width:240px;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .app.nav-open .nav{transform:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}
  h1{font-size:22px}
  .item{flex-wrap:wrap} .item .acts{width:100%;justify-content:flex-start}
}
@media (min-width:821px){ #navBtn{display:none} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<div class="app" id="app">
  <nav class="nav" aria-label="Modules">
    <div class="brand"><span class="mark"><i></i></span><div><b>SnapFlow</b><small id="tenantName">Brightline Portraits · sample data</small></div></div>
    <div class="navlist" id="navlist"></div>
    <div class="navfoot">
      <label class="label" for="role">Signed in as</label>
      <select id="role"></select>
      <button class="linkbtn" data-act="reset">Reset sample data</button>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <button class="btn sm" id="navBtn" data-act="nav">Menu</button>
      <b id="topTitle">SnapFlow</b>
      <button class="btn sm primary" data-act="agent">Ask SnapFlow</button>
    </div>
    <main class="view" id="view"></main>
  </div>
  <aside class="agent" aria-label="SnapFlow assistant">
    <header><span class="orb" id="orb"></span><h2>Operator</h2><span class="pill" id="aiStatus">Starting</span><button class="btn sm ghost onlysm" data-act="agent">Close</button></header>
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>
    <form class="composer" id="composer">
      <textarea id="ask" rows="1" placeholder="Tell SnapFlow what to do…" aria-label="Tell SnapFlow what to do"></textarea>
      <button class="btn primary" id="sendBtn">Send</button>
    </form>
  </aside>
  <div class="scrim" data-act="closeDrawers"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function wd(n){const d=new Date();d.setHours(0,0,0,0);while(d.getDay()%6===0)d.setDate(d.getDate()+1);let i=0;while(i<n){d.setDate(d.getDate()+1);if(d.getDay()%6!==0)i++}return d}
function dayLabel(n){const d=wd(n),t=new Date();t.setHours(0,0,0,0);return (d.getTime()===t.getTime()?'Today · ':'')+d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function spark(v,cls){const w=120,h=30,mx=Math.max(...v),mn=Math.min(...v),x=i=>i*(w/(v.length-1)),y=q=>h-3-((q-mn)/(mx-mn||1))*(h-8);
  const pts=v.map((q,i)=>x(i).toFixed(1)+','+y(q).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${h} ${pts} ${w},${h}" fill="var(--accent-soft)"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`}
const pill=(t,c='')=>`<span class="pill ${c}">${esc(t)}</span>`;
const bar=(p,c='')=>`<div class="bar ${c}"><i style="width:${Math.max(2,Math.min(100,p))}%"></i></div>`;

/* ---------- sample data ---------- */
function seed(){return {
  role:'Owner',
  autonomy:{Scheduling:'auto',Sales:'ask',Contracts:'ask',Orders:'ask',Support:'ask',Accounting:'ask'},
  brandHue:262,
  schools:[

const LEVELS={suggest:'Suggest only',ask:'Ask before sending',auto:'Run on its own'};
const evName=id=>{const e=by('events',id);return e?`${school(e.school).name} ${e.type.toLowerCase()}`:'shoot'};

function expand(actions){const out=[];for(const a of actions||[]){if(!a||!OPS[a.op])continue;
  if(a.op==='approve'){const q=by('queue',a.item);if(q){out.push(...expand(q.actions).map(x=>({...x,_q:q.id})))}continue}
  out.push(a);if(a.op==='mark_signed')DEPTS.forEach((_,i)=>out.push({op:'notify',i}))}return out}
function needsOK(a){const o=OPS[a.op];if(o.risk==='none')return false;const lvl=S.autonomy[o.area]||'ask';return lvl==='suggest'?true:lvl==='ask'?o.risk==='outbound':false}

/* ---------- plans ---------- */
let planSeq=0;
function propose(say,actions,opts={}){
  const steps=expand(actions).map(a=>({a,label:OPS[a.op].label(a),st:'todo',note:''}));
  const m={role:'ai',text:say||''};
  if(steps.length){m.plan={id:++planSeq,steps,status:'proposed'};chat.push(m);renderChat();
    if(opts.force||!steps.some(s=>needsOK(s.a)))runPlan(m.plan)}
  else{chat.push(m);renderChat()}
}
async function runPlan(plan){
  if(plan.status!=='proposed'||busy&&plan.status==='running')return;
  plan.status='running';undoSnap=JSON.stringify(S);busyOn(true);
  for(const s of plan.steps){s.st='run';renderChat();await sleep(s.a.op==='notify'?260:420);
    try{s.note=OPS[s.a.op].run(s.a);s.st='done';if(s.a.op!=='go'&&s.a.op!=='notify')S.log.unshift({t:Date.now(),who:'SnapFlow',text:s.label,note:s.note});
      if(s.a._q)S.queue=S.queue.filter(q=>q.id!==s.a._q)}
    catch(e){s.st='skip';s.note=e.message}
    render();renderChat()}
  plan.status='done';busyOn(false);save();render();renderChat();
  const n=plan.steps.filter(s=>s.st==='done'&&s.a.op!=='go'&&s.a.op!=='notify').length;
  if(n)toast(`${n} ${n===1?'action':'actions'} done`,true);
}
function doNow(actions,userText){if(busy)return;if(userText)chat.push({role:'user',text:userText});propose('',actions,{force:true});openAgentIfRoom()}
function undo(){if(!undoSnap)return;S=JSON.parse(undoSnap);undoSnap=null;S.log.unshift({t:Date.now(),who:'You',text:'Undid the last run',note:''});save();render();toast('Undone')}

V.capture=()=>{const c=S.capture,i=c.idx,shots=c.shots[i]||[],name=ROSTER[i],flag=FLAGS[i+'-'+(shots.length-1)];

    <div class="finder" role="img" aria-label="Camera viewfinder showing a seated portrait on a blue backdrop"><div class="body-s"></div><div class="head-s"></div><div class="face ${flag?'flag':''}"></div><span class="cnr a"></span><span class="cnr b"></span><span class="cnr c"></span><span class="cnr d"></span><span class="tag">${esc(name)} · pose ${Math.min(shots.length+1,3)}/3</span><div class="hud"><span>1/160</span><span>f/8</span><span>ISO 200</span><span>5200K</span></div></div>

V.analytics=()=>{const m=['Aug','Sep','Oct','Nov'],last=[38,142,196,88],now=[44,168,214,61],W=560,H=220,L=40,B=28,T=12,mx=240,y=v=>T+(H-T-B)*(1-v/mx),gw=(W-L)/4,bw=34;

  <div class="card flush">${S.rules.map(r=>`<div class="item"><div class="body"><b>${esc(r.name)}</b><small>When: ${esc(r.trigger)} · ${r.steps} ${r.steps===1?'step':'steps'} · ran ${r.runs} times this season</small></div><button class="switch" role="switch" aria-checked="${r.on}" aria-label="${esc(r.name)}" data-act="rule" data-id="${r.id}"></button></div>`).join('')}</div>`;

  `<div class="card flush"><div class="tablebox"><table><thead><tr><th>Company</th><th>Plan</th><th class="r">Schools</th><th class="r">Seats</th><th class="r">MRR</th></tr></thead><tbody>${S.tenants.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${pill(t.tier,t.tier==='Enterprise'?'ai':'')}</td><td class="r num">${t.schools}</td><td class="r num">${t.seats}</td><td class="r num">${money(t.mrr)}</td></tr>`).join('')}</tbody></table></div></div>

V.activity=()=>head('Activity','Everything SnapFlow did on your behalf, newest first.',undoSnap?'<button class="btn" data-act="undo">Undo last run</button>':'')+
  `<div class="card flush">${S.log.map(l=>`<div class="item"><div class="body"><b>${esc(l.text)}</b><small>${esc(l.note||'')}</small></div><span class="faint num">${esc(l.who)} · ${new Date(l.t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span></div>`).join('')||'<div class="empty">Nothing yet. Approve something on the briefing or ask the operator to do a task.</div>'}</div>`;

/* ---------- render ---------- */
function renderNav(){
  $('#navlist').innerHTML=NAV.map(g=>{const items=g[1].filter(i=>can(i[0]));if(!items.length)return '';return `<span class="label">${g[0]}</span>`+items.map(i=>{const n={briefing:S.queue.filter(x=>areaVisible(x.area)).length,schedule:S.events.filter(e=>!e.crew).length,support:S.tickets.filter(t=>t.status==='Open').length,orders:S.exceptions.filter(x=>!x.done).length}[i[0]];return `<a href="#${i[0]}" ${i[0]===view?'aria-current="page"':''}>${i[1]}${n?`<span class="badge num">${n}</span>`:''}</a>`}).join('')}).join('');
  $('#role').innerHTML=Object.keys(ACCESS).map(r=>`<option ${r===S.role?'selected':''}>${r}</option>`).join('');
  $('#topTitle').textContent=TITLES[view];
}
function render(){
  document.documentElement.style.setProperty('--hue',S.brandHue);
  if(!can(view))view='briefing';
  renderNav();
  const el=$('#view'),top=el.scrollTop,ae=document.activeElement,keep=ae&&ae.id&&el.contains(ae)?{id:ae.id,v:ae.value,s:ae.selectionStart}:null;
  el.innerHTML=`<div class="wrap">${V[view]()}</div>`;el.scrollTop=top;
  if(keep){const n=document.getElementById(keep.id);if(n){n.value=keep.v;n.focus();try{n.setSelectionRange(keep.s,keep.s)}catch(e){}}}
  renderChips();
}
function renderChat(){
  const el=$('#msgs');
  el.innerHTML=(chat.length?'':`<div class="msg ai"><b>I run the busywork so you can run picture day.</b>\nTell me what you want done in plain words. I show the plan, ask before anything goes out to a school or parent, and log every step so you can undo it.</div>`)+chat.map(m=>{
    if(m.role==='user')return `<div class="msg user">${esc(m.text)}</div>`;
    let h=m.text?`<div class="msg ai">${esc(m.text)}</div>`:'';
    if(m.plan){const p=m.plan;h+=`<div class="plan"><div class="ph"><span class="label">Plan · ${p.steps.length} ${p.steps.length===1?'step':'steps'}</span>${pill({proposed:'Waiting for you',running:'Running',done:'Done',cancelled:'Cancelled'}[p.status],p.status==='done'?'ok':p.status==='proposed'?'warn':'ai')}</div><ol>${p.steps.map(s=>`<li class="${s.st}"><span class="st"></span><span>${esc(s.label)}${s.note?`<small>${esc(s.note)}</small>`:''}</span></li>`).join('')}</ol>${p.status==='proposed'?`<div class="pf"><button class="btn sm primary" data-act="runPlan" data-id="${p.id}">Run plan</button><button class="btn sm ghost" data-act="cancelPlan" data-id="${p.id}">Cancel</button></div>`:''}</div>`}
    return h}).join('')+(busy==='think'?'<div class="msg ai muted">Thinking…</div>':'');
  el.scrollTop=el.scrollHeight;
}
const CHIPS={briefing:['What needs my attention today?','Approve everything that stays internal','Who is shooting today?'],pipeline:['Which deal should I work first?','Send a follow-up to Northgate ISD'],contracts:['Sunnyside signed. Kick off onboarding','Which contracts end soon?'],schools:['Which school needs attention?','Open the schedule'],schedule:['Assign all open shoots','Who is free on the next open day?'],capture:['How does the 3-pose check work?'],orders:['Remind Riverbend families who have not ordered','Fix the order exceptions'],support:['Send all drafted replies','Which tickets are close to SLA?'],parents:['When are retakes?'],accounting:['Chase overdue invoices','Sync QuickBooks'],analytics:['Which schools are behind last fall?'],automations:['Let Support run on its own','Turn on the late invoice nudge'],admin:['Open the briefing'],activity:['What did you do today?']};
function renderChips(){$('#chips').innerHTML=(CHIPS[view]||[]).map(c=>`<button class="chip" data-act="say" data-q="${esc(c)}">${esc(c)}</button>`).join('')}
function busyOn(b){busy=b;$('#orb').classList.toggle('busy',!!b);$('#sendBtn').textContent=b==='think'?'Stop':'Send';$('#sendBtn').disabled=b===true}
let toastT;function toast(t,withUndo){const el=$('#toast');el.innerHTML=esc(t)+(withUndo&&undoSnap?' <button data-act="undo">Undo</button>':'');el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,5000)}
function setStatus(){const el=$('#aiStatus');el.textContent={starting:'Starting',claude:'Claude connected',local:'Built-in commands'}[aiMode];el.className='pill '+(aiMode==='claude'?'ok':'');el.title=aiMode==='local'?'Claude is not available in this view, so the operator understands a fixed set of commands.':''}
const openAgentIfRoom=()=>{if(window.innerWidth<=1180)$('#app').classList.add('agent-open')};

/* ---------- understanding a request ---------- */
function snapshot(){return {role:S.role,screen:view,autonomy:S.autonomy,
  schools:S.schools.map(s=>({id:s.id,name:s.name,zone:s.zone,participation:s.part,health:s.health})),
  photographers:S.crew.map(p=>({id:p.id,name:p.name,zone:p.zone,shoots:load(p.id),daysOff:p.off})),
  shoots:S.events.map(e=>({id:e.id,school:school(e.school).name,type:e.type,day:dayLabel(e.day),dayIndex:e.day,students:e.students,photographer:e.crew,status:e.status})),
  deals:S.deals.map(d=>({id:d.id,name:d.name,stage:d.stage,value:d.value,score:d.score,next:d.next})),
  contracts:S.contracts.map(c=>({id:c.id,title:c.title,status:CSTEPS[c.step],value:c.value,note:c.note})),
  galleries:S.orders.map(o=>({id:o.id,school:school(o.school).name,participation:partOf(o),lastFall:o.lastYear,notOrdered:o.shot-o.ordered,closesInDays:o.closes,reminded:o.reminded})),
  exceptions:S.exceptions.filter(x=>!x.done).map(x=>({id:x.id,what:x.what,who:x.who})),
  tickets:S.tickets.filter(t=>t.status==='Open').map(t=>({id:t.id,subject:t.subject,from:t.from,priority:t.pri,slaHours:t.sla})),
  invoices:S.invoices.map(i=>({id:i.id,school:school(i.school).name,amount:i.amount,status:i.status,daysLate:i.age,inQuickBooks:i.qb})),
  automations:S.rules.map(r=>({id:r.id,name:r.name,on:r.on})),
  approvalQueue:S.queue.map(q=>({id:q.id,area:q.area,title:q.title,sendsOutbound:q.actions.some(a=>OPS[a.op].risk==='outbound')}))}}
const RULES=()=>`You are the operator inside SnapFlow, software that runs a school photography company. You act for the signed-in user by choosing operations; the app runs them and asks the user to confirm anything that goes out to schools or parents.
Reply with ONLY one JSON object: {"say": string, "actions": [{"op": string, ...}]}
"say": 1 to 3 short plain sentences. Answer questions from the data below. Use names, never ids. No markdown.
"actions": operations to run in order, or [] when the user only asked a question. Only use ids that exist in the data. Never invent an operation.
Operations:
{"op":"go","view":one of ${Object.keys(TITLES).filter(can).join('|')}}
{"op":"assign","event":shootId,"photographer":photographerId}
{"op":"auto_schedule"} assigns every shoot with no photographer
{"op":"send_contract","contract":id} sends for e-signature
{"op":"mark_signed","contract":id} records a signature and starts all six departments
{"op":"send_reminder","order":galleryId} emails and texts families who have not ordered
{"op":"reply_ticket","ticket":id} sends the drafted reply
{"op":"resolve_exception","exception":id}
{"op":"sync_quickbooks"}
{"op":"chase_invoice","invoice":id}
{"op":"advance_deal","deal":id}
{"op":"send_followup","deal":id}
{"op":"toggle_automation","automation":id,"on":boolean}
{"op":"set_autonomy","area":Scheduling|Sales|Contracts|Orders|Support|Accounting,"level":suggest|ask|auto}
{"op":"approve","item":queueId} runs an item from the approval queue
Example: {"say":"Dana is free and in the North zone, so I'm putting her on Oakmont.","actions":[{"op":"assign","event":"e4","photographer":"p1"}]}
Current data: ${JSON.stringify(snapshot())}`;

function localBrain(q){const t=q.toLowerCase(),has=(...w)=>w.some(x=>t.includes(x));
  const find=(list,key='name')=>S[list].find(x=>{const n=(key==='school'?school(x.school).name:x[key]).toLowerCase();return n.split(/[ ·—]+/).filter(w=>w.length>3).some(w=>t.includes(w))});
  const navHit=Object.keys(TITLES).find(v=>t.includes(TITLES[v].toLowerCase())||t.includes(v));
  if(has('approve')){const items=S.queue.filter(x=>has('all','everything')&&!has('internal','low-risk','safe')?true:!x.actions.some(a=>OPS[a.op].risk==='outbound'));return items.length?{say:`Running ${items.length} approved ${items.length===1?'item':'items'}.`,actions:items.map(i=>({op:'approve',item:i.id}))}:{say:'Nothing in the queue is internal-only. The rest sends something out, so approve those one by one.',actions:[]}}
  if(has('assign','staff','auto-schedule','schedule all'))return {say:'Assigning each open shoot to the closest free photographer.',actions:[{op:'auto_schedule'},{op:'go',view:'schedule'}]};
  if(has('signed','signature','onboard')){const c=find('contracts','title')||by('contracts','c1');return {say:`Recording the signature on ${c.title} and starting every department.`,actions:[{op:'go',view:'contracts'},{op:'mark_signed',contract:c.id}]}}
  if(has('renew')||has('send')&&has('contract')){const c=find('contracts','title')||by('contracts','c2');return {say:`Sending ${c.title}.`,actions:[{op:'send_contract',contract:c.id}]}}
  if(has('remind','have not ordered',"haven't ordered")){const o=find('orders','school')||[...S.orders].sort((a,b)=>partOf(a)-partOf(b))[0];return {say:`${o.shot-o.ordered} families at ${school(o.school).name} have not ordered.`,actions:[{op:'send_reminder',order:o.id}]}}
  if(has('exception'))return {say:'Applying the proposed fix to each open exception.',actions:S.exceptions.filter(x=>!x.done).map(x=>({op:'resolve_exception',exception:x.id}))};
  if(has('draft','repl')){const ts=S.tickets.filter(x=>x.status==='Open'&&(!has('except','safe')||x.pri!=='High'));return {say:`${ts.length} drafted replies ready to send.`,actions:ts.map(x=>({op:'reply_ticket',ticket:x.id}))}}
  if(has('sla','ticket')){const ts=S.tickets.filter(x=>x.status==='Open').sort((a,b)=>a.sla-b.sla);return {say:ts.length?`Closest to SLA: "${ts[0].subject}" with ${ts[0].sla}h left. ${ts.length} tickets are open.`:'No open tickets.',actions:[{op:'go',view:'support'}]}}
  if(has('chase','overdue')){const od=S.invoices.filter(i=>i.status==='Overdue');return od.length?{say:`${od.length} invoices are overdue for ${money(od.reduce((s,i)=>s+i.amount,0))}.`,actions:od.map(i=>({op:'chase_invoice',invoice:i.id}))}:{say:'Nothing is overdue.',actions:[]}}
  if(has('quickbooks','sync'))return {say:'Syncing with QuickBooks Online.',actions:[{op:'sync_quickbooks'}]};
  if(has('follow')){const d=find('deals')||by('deals','d1');return {say:`Follow-up for ${d.name} is drafted from the proposal thread.`,actions:[{op:'send_followup',deal:d.id}]}}
  if(has('deal','work first')){const d=[...S.deals].filter(x=>x.stage!=='Won').sort((a,b)=>b.score*b.value-a.score*a.value)[0];return {say:`${d.name}: ${money(d.value)} with a score of ${d.score}. Next step: ${d.next}.`,actions:[{op:'go',view:'pipeline'}]}}
  if(has('on its own','autopilot')){const a=Object.keys(S.autonomy).find(x=>t.includes(x.toLowerCase()));if(a)return {say:`${a} will now act and report back.`,actions:[{op:'set_autonomy',area:a,level:'auto'}]}}
  if(has('turn on','turn off','pause')){const r=find('rules')||by('rules','a5');return {say:'',actions:[{op:'toggle_automation',automation:r.id,on:!has('off','pause')}]}}
  if(has('behind','participation')){const b=S.orders.filter(o=>partOf(o)<o.lastYear).map(o=>`${school(o.school).name} (${partOf(o)}% vs ${o.lastYear}%)`);return {say:b.length?'Behind last fall: '+b.join(', ')+'.':'Every gallery is at or ahead of last fall.',actions:[]}}
  if(has('free')){const d=(S.events.find(e=>!e.crew)||{day:1}).day;const f=S.crew.filter(p=>!p.off.includes(d)&&!S.events.some(e=>e.day===d&&e.crew===p.id)).map(p=>p.name);return {say:`Free on ${dayLabel(d)}: ${f.join(', ')||'no one'}.`,actions:[]}}
  if(has('shooting today','who is shooting')){return {say:S.events.filter(e=>e.day===0).map(e=>`${crewName(e.crew)} at ${school(e.school).name}`).join('; ')+'.',actions:[]}}
  if(has('retake'))return {say:`Retakes: Maple Grove ${dayLabel(0)}, Oakmont ${dayLabel(1)}, Sunnyside ${dayLabel(3)}.`,actions:[]};
  if(has('attention','today','brief','school needs')){const o=S.events.filter(e=>!e.crew).length,k=S.tickets.filter(x=>x.status==='Open'&&x.sla<=2).length;return {say:`${S.queue.length} items wait for your OK, ${o} shoots need a photographer and ${k} ticket is close to SLA. Riverbend Middle participation is the biggest risk this week.`,actions:[{op:'go',view:'briefing'}]}}
  if(has('what did you do')){return {say:S.log.length?`${S.log.length} actions so far. The latest: ${S.log[0].text}.`:'Nothing yet in this session.',actions:[{op:'go',view:'activity'}]}}
  if(has('3-pose','pose'))return {say:'Each student gets three frames. Every frame is checked for closed eyes, glare and head turn, and the best one is accepted so parents choose from good poses only.',actions:[]};
  if(navHit)return {say:'',actions:[{op:'go',view:navHit}]};
  return {say:'I can assign shoots, send contracts and reminders, reply to tickets, chase invoices, sync QuickBooks and open any screen. Try one of the suggestions below.',actions:[]}}

async function ask(q){q=q.trim();if(!q||busy)return;chat.push({role:'user',text:q});openAgentIfRoom();
  let out=null;
  if(sample&&aiMode==='claude'){busyOn('think');renderChat();ctl=new AbortController();
    const turns=chat.filter(m=>m.text).slice(-7).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}));
    while(turns.length&&turns[0].role!=='user')turns.shift();
    try{const r=await sample.json([{role:'user',content:RULES()},...turns],{modelTier:'quick',cache:false,signal:ctl.signal});
      if(r&&typeof r==='object')out={say:String(r.say||''),actions:Array.isArray(r.actions)?r.actions:[]}}
    catch(e){if(e&&e.code==='cancelled'){busyOn(false);chat.push({role:'ai',text:'Stopped.'});renderChat();return}
      if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)){aiMode='local';setStatus()}
      else if(e&&e.code==='rate_limited'){busyOn(false);chat.push({role:'ai',text:'Claude is rate limited right now. Try again in a minute, or use a suggestion below.'});renderChat();return}}
    busyOn(false)}
  if(!out)out=localBrain(q);
  propose(out.say,out.actions);
}

/* ---------- events ---------- */
const ACT={
  nav:()=>$('#app').classList.toggle('nav-open'),
  agent:()=>{$('#app').classList.toggle('agent-open');if($('#app').classList.contains('agent-open'))$('#ask').focus()},
  closeDrawers:()=>$('#app').classList.remove('nav-open','agent-open'),
  reset:()=>{S=seed();chat=[];undoSnap=null;save();render();renderChat();toast('Sample data reset')},
  say:d=>ask(d.q),
  op:d=>{const a={...d};delete a.act;if('on' in a)a.on=a.on==='true';const lab=OPS[a.op].label(a);
    if(needsOK(a)&&S.autonomy[OPS[a.op].area]==='suggest'){chat.push({role:'user',text:lab});propose('This area is set to suggest only, so here is the plan.',[a]);openAgentIfRoom()}else doNow([a],lab)},
  approve:d=>{const q=by('queue',d.id);if(q)doNow([{op:'approve',item:q.id}],'Approve: '+q.title)},
  approveAll:()=>doNow(S.queue.filter(x=>areaVisible(x.area)).map(q=>({op:'approve',item:q.id})),'Approve everything in the queue'),
  dismiss:d=>{S.queue=S.queue.filter(q=>q.id!==d.id);save();render();toast('Dismissed')},
  runPlan:d=>{const m=chat.find(m=>m.plan&&m.plan.id==d.id);if(m&&!busy)runPlan(m.plan)},
  cancelPlan:d=>{const m=chat.find(m=>m.plan&&m.plan.id==d.id);if(m){m.plan.status='cancelled';m.plan.steps.forEach(s=>s.st='skip');renderChat()}},
  undo:()=>undo(),
  pick:d=>{sel[d.kind]=d.id;render()},
  autonomy:d=>{S.autonomy[d.area]=d.level;save();render()},
  rule:d=>{const r=by('rules',d.id);r.on=!r.on;save();render()},
  flag:d=>{S.flags[d.f]=!S.flags[d.f];save();render()},
  hue:d=>{S.brandHue=+d.h;save();render()},
  shoot:()=>{const c=S.capture;(c.shots[c.idx]=c.shots[c.idx]||[]).push(1);save();render()},
  retake:()=>{const c=S.capture;c.shots[c.idx]=[];if(c.accepted)delete c.accepted[c.idx];save();render()},
  acceptBest:()=>{const c=S.capture,sh=c.shots[c.idx]||[];let b=sh.findIndex((_,k)=>!FLAGS[c.idx+'-'+k]);if(b<0)b=0;(c.accepted=c.accepted||{})[c.idx]=b;c.idx=Math.min(ROSTER.length-1,c.idx+1);save();render()},
  student:d=>{S.capture.idx=+d.i;save();render()},
  scan:()=>{const c=S.capture,acc=c.accepted||{};const n=ROSTER.findIndex((_,k)=>acc[k]===undefined&&k!==c.idx);if(n>=0){c.idx=n;save();render();toast('Ticket scanned: '+ROSTER[n])}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='A')return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el.dataset)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.ticket){const k=by('tickets',t.dataset.ticket);if(k){k.draft=t.value;save()}}});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='composer'){if(busy==='think'){ctl&&ctl.abort();return}const a=$('#ask');const q=a.value;a.value='';ask(q)}
  if(e.target.id==='lookup'){const c=$('#code').value.trim().toUpperCase(),o=$('#lookupOut');const D={'MG-4821':'Ava B. · Package B · at the lab, ships in 3 days','RB-1077':'Noah C. · no order yet · gallery closes in 5 days'};o.textContent=D[c]||'No order found for that code. Check the flyer or ask us below.'}});
$('#ask').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openAgentIfRoom();$('#ask').focus()}});
$('#role').addEventListener('change',e=>{S.role=e.target.value;save();render()});
function route(){const h=location.hash.slice(1);view=V[h]?h:'briefing';$('#app').classList.remove('nav-open');render();$('#view').scrollTop=0}
window.addEventListener('hashchange',route);

route();renderChat();setStatus();
(async()=>{try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){sample=null}aiMode=sample?'claude':'local';setStatus()})();
</script>
